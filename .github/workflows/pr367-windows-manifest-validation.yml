name: PR367 Windows checksum command validation
on:
  push:
    branches:
      - validation/pr367-sha-20261013
jobs:
  verify-manifest-parser:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test documentation recipe against real and synthetic SHA256SUMS entries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $doc = Get-Content -LiteralPath 'docs/PORTABLE_UPGRADE.md' -Raw
          $pattern = '(?s)## 4\. Download and verify the new release.*?~~~powershell\s*(.*?)\s*~~~'
          $match = [regex]::Match($doc, $pattern)
          if (-not $match.Success) { throw 'Missing documented ZIP verification PowerShell block' }
          $snippet = [ScriptBlock]::Create($match.Groups[1].Value)
          $filename = 'LocalTimeTracker-1.3.0-portable-x64.zip'
          $ReleaseZip = Join-Path $env:RUNNER_TEMP $filename
          $actualManifest = Join-Path $env:RUNNER_TEMP 'original-SHA256SUMS.txt'
          $Checksums = Join-Path $env:RUNNER_TEMP 'test-SHA256SUMS.txt'
          $zipUrl = 'https://github.com/HafidIdrissi/Time-Tracker/releases/download/v1.3.0/' + $filename
          $sumUrl = 'https://github.com/HafidIdrissi/Time-Tracker/releases/download/v1.3.0/SHA256SUMS.txt'
          Invoke-WebRequest -Uri $zipUrl -OutFile $ReleaseZip -UseBasicParsing
          Invoke-WebRequest -Uri $sumUrl -OutFile $actualManifest -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $ReleaseZip -Algorithm SHA256).Hash
          $real = Get-Content -LiteralPath $actualManifest -Raw
          $cases = @(
            @{ Name='genuine_manifest'; Content=$real; Accept=$true },
            @{ Name='valid_binary_marker'; Content=($actual + ' *' + $filename); Accept=$true },
            @{ Name='valid_text_marker'; Content=($actual + '  ' + $filename); Accept=$true },
            @{ Name='missing'; Content=''; Accept=$false },
            @{ Name='duplicate'; Content=(($actual + ' *' + $filename), ($actual + '  ' + $filename) -join [Environment]::NewLine); Accept=$false },
            @{ Name='suffix_only'; Content=($actual + ' *Other' + $filename); Accept=$false },
            @{ Name='wrong_hash'; Content=(('0'*64) + ' *' + $filename); Accept=$false },
            @{ Name='invalid_hash'; Content=(('a'*63) + ' *' + $filename); Accept=$false }
          )
          foreach ($case in $cases) {
            [IO.File]::WriteAllText($Checksums, [string]$case.Content)
            $accepted = $true
            try { $null = & $snippet } catch { $accepted = $false }
            if ($accepted -ne $case.Accept) { throw ('FAILED CASE ' + $case.Name + ': accepted=' + $accepted) }
            Write-Host ('PASS ' + $case.Name + ': accepted=' + $accepted)
          }
          Write-Host 'PASS eight PowerShell manifest cases on Windows'
